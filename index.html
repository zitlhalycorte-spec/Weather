<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>What's the Weather?</title>
        <link rel="stylesheet" href="src/style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Crafty+Girls&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="weather-app">
        <header>
            <form class="search-form">
                <input type="search" placeholder="Enter a city..." required class="search-form-input" />
                <input type="submit" value="Search" class="search-form-button" />
            </form>
        </header>
        <main>
            <div class="weather-app-data">
                <div>
                    <h1 class="weather-app-city">Fontana</h1>
                    <p>
                        Thursday 15:16, Sunny
                        <br />
                        Humidity: 5%, Wind: 2 km/h
                    </p>
                </div>
                <div><img src="icons/sunny.gif" alt="Sunny" width="50" height="50" /> 98°F</div>
            </div>
        </main>
        <footer>
            This project is coded by <a href="https://github.com/zitlhalycorte-spec" target="_blank">Zitlhaly Corte</a> and is on
            <a href="https://github.com/zitlhalycorte-spec/Weather" target="_blank">GitHub, </a> hosted by
            <a href="https://weatherproject-z.netlify.app" target="_blank">Netlify</a>.
        </footer>
        </div>
    </body>
</html>
