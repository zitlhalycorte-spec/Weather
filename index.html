<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>What's the Weather?</title>
        <link rel="stylesheet" href="src/style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Crafty+Girls&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    </head>
    <body>
        <div class="weather-app" id="weather-app">
        <header>
            <form class="search-form" id="search-form">
                <input type="search" placeholder="Enter a city..." required id="search-form-input" class="search-form-input" />
                <input type="submit" value="Search" class="search-form-button" />
            </form>
        </header>
        <main>
            <div class="weather-app-data">
                <div>
                    <h1 class="weather-app-city" id="city"></h1>
                    <p class="weather-app-details" id="details">
                        Thursday 15:16, Sunny
                        <br />
                        Humidity: <strong>5%</strong>, Wind: <strong>2 km/h</strong>
                    </p>
                </div>
                <div class="weather-app-temperature-container">
                    <div class="weather-app-icon">
                        <img src="icons/sunny.gif" alt="Sunny" width="60" height="60" id="icon"/>
                    </div>
                    <div class="weather-app-temperature" id="temperature"></div>
                    <div class="weather-app-unit"> °F</div>
                </div>
            </div>
        </main>
        <footer>
            This project is coded by <a href="https://github.com/zitlhalycorte-spec" target="_blank">Zitlhaly Corte</a> and is on
            <a href="https://github.com/zitlhalycorte-spec/Weather" target="_blank">GitHub, </a> hosted by
            <a href="https://weatherproject-z.netlify.app" target="_blank">Netlify</a>.
        </footer>
        </div>
        <script src="src/index.js"></script>
    </body>
</html>
